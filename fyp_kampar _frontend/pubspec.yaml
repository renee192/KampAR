name: fyp_kampar
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+2
  permission_handler: ^11.0.0
  http: ^1.2.1
  ar_flutter_plugin_2: 
    git:
      url: https://github.com/renee192/ar_flutter_plugin_2
  vector_math: ^2.1.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  
flutter_icons:
  android: true
  image_path: "assets/applogo.png" 
  adaptive_icon_background: "#c4ecff"
  adaptive_icon_foreground: "assets/applogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/places/
    - assets/models/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Montserrat-Bold
      fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf